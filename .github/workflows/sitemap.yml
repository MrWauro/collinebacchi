name: Generate Sitemap

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Generate sitemap
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml

          for file in *.html; do
            if [ "$file" != "404.html" ]; then

              priority="0.8"
              changefreq="monthly"

              if [ "$file" = "index.html" ]; then
                loc="https://collinebacchi.com/"
                priority="1.0"
                changefreq="weekly"
              else
                loc="https://collinebacchi.com/${file}"
              fi

              if [ "$file" = "prodotti.html" ]; then
                priority="0.9"
                changefreq="weekly"
              fi

              if [ "$file" = "contatti.html" ]; then
                priority="0.7"
                changefreq="yearly"
              fi

              if [ "$file" = "privacy.html" ] || [ "$file" = "cookie.html" ]; then
                priority="0.3"
                changefreq="yearly"
              fi

              echo "  <url>" >> sitemap.xml
              echo "    <loc>$loc</loc>" >> sitemap.xml
              echo "    <lastmod>$(date +%Y-%m-%d)</lastmod>" >> sitemap.xml
              echo "    <changefreq>$changefreq</changefreq>" >> sitemap.xml
              echo "    <priority>$priority</priority>" >> sitemap.xml
              echo "  </url>" >> sitemap.xml

            fi
          done

          echo '</urlset>' >> sitemap.xml

      - name: Commit sitemap if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "Auto update sitemap"
          git push
