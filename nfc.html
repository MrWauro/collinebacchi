<!DOCTYPE html>
<html lang="it"> 
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Colline Bacchi</title>
<meta name="description" content="Contatti rapidi Colline Bacchi">

<link rel="stylesheet" href="css/style.css">

<style>
/* Layout centrato tipo landing NFC */

.nfc-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  padding: 20px;
  text-align: center;
}

.nfc-logo {
  width: 140px;
  height: auto;
  margin-bottom: 30px;
}

.nfc-buttons {
  display: flex;
  flex-direction: column;
  gap: 18px;
  width: 100%;
  max-width: 280px;
}
</style>

</head>

<body>

<main class="nfc-wrapper">

  <!-- LOGO -->
  <img src="img/logo1.webp" alt="Colline Bacchi" class="nfc-logo">

  <!-- BOTTONI -->
  <div class="nfc-buttons">

    <a href="https://collinebacchi.com" class="btn">
      SITO WEB
    </a>

    <a href="https://instagram.com/colline.bacchi" class="btn" target="_blank">
      INSTAGRAM
    </a>

    <a href="contatto.vcf" class="btn">
      AGGIUNGI CONTATTO
    </a>

  </div>

</main>

</body>
</html>
